name = "4dmap-download-tracker"
main = "src/index.js"
# Set this to today's date
compatibility_date = "2026-09-10"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# Isolated counter: KV namespace 4DMAP_DOWNLOADS
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "e962292069794bcc8cb89e3f559cfa43"

[assets]
directory = "./public"
binding = "ASSETS"
# /v1/* covers local /v1/{op} and /v1/mesh/* (AZIEL_RUNTIME proxy).
run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/v1", "/v1/*", "/openapi.json", "/ai", "/ai/*", "/mcp", "/mcp/", "/robots.txt", "/sitemap.xml", "/cite.json"]

[vars]
AZIEL_RUNTIME_ORIGIN = "https://aziel-runtime.vibelock.workers.dev"

[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[observability]
enabled = true

  [observability.logs]
  head_sampling_rate = 1
